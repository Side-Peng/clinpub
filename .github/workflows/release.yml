# Release workflow — GitHub Release only
# Since v2.0, clinpub is distributed via Claude Code Plugin system (not npm)
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - name: claude-code
            dir: claude-code
            plugin: .claude-plugin/plugin.json
            commands: commands/*.md
            hooks: inline  # hooks declared in plugin.json (official inline option)
          - name: codex
            dir: codex/clinpub
            plugin: .codex-plugin/plugin.json
            commands: skills/clinpub-*/SKILL.md
            hooks: hooks/hooks.json
          - name: qoder
            dir: qoder
            plugin: .qoder-plugin/plugin.json
            commands: skills/*/SKILL.md
            hooks: ""  # Qoder uses PreToolUse config, no hooks.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate ${{ matrix.platform.name }} Plugin
        working-directory: ${{ matrix.platform.dir }}
        run: |
          echo "=== Validating ${{ matrix.platform.name }} ==="

          # Validate plugin manifest
          echo "Checking plugin manifest..."
          test -f "${{ matrix.platform.plugin }}" || { echo "Missing ${{ matrix.platform.plugin }}"; exit 1; }
          node -e "
            const p = require('./${{ matrix.platform.plugin }}');
            if (!p.name || !p.version) { console.error('Invalid plugin.json'); process.exit(1); }
            console.log('Plugin:', p.name, 'v' + p.version);
          "

          # Validate commands/skills
          echo "Checking commands..."
          ls ${{ matrix.platform.commands }} > /dev/null 2>&1 || { echo "No command files found"; exit 1; }
          echo "  Found: $(ls ${{ matrix.platform.commands }} | wc -l) command files"

          # Validate hooks
          # claude-code: hooks declared inline in plugin.json (official "or" option)
          # codex: hooks declared in hooks/hooks.json
          # qoder: uses PreToolUse config, no hooks.json
          if [ "${{ matrix.platform.hooks }}" = "inline" ]; then
            echo "Checking hooks (inline in plugin.json)..."
            node -e "
              const p = require('./${{ matrix.platform.plugin }}');
              if (!p.hooks || !p.hooks.PreToolUse || p.hooks.PreToolUse.length === 0) {
                console.error('Missing inline hooks in plugin.json'); process.exit(1);
              }
              console.log('Hooks OK:', Object.keys(p.hooks).join(', '));
            "
          elif [ -n "${{ matrix.platform.hooks }}" ]; then
            echo "Checking hooks..."
            test -f "${{ matrix.platform.hooks }}" || { echo "Missing hooks.json"; exit 1; }
            node -e "
              const h = require('./${{ matrix.platform.hooks }}');
              if (!h.hooks) { console.error('Invalid hooks.json'); process.exit(1); }
              console.log('Hooks OK:', Object.keys(h.hooks).join(', '));
            "
          fi

          echo "=== ${{ matrix.platform.name }} validation passed ==="

  consistency:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cross-Platform File Consistency
        run: |
          echo "=== Checking cross-platform file consistency (git blob hashes) ==="
          ERRORS=0

          # Helper: blob hash of a path in HEAD (empty if missing)
          blob_hash() {
            git rev-parse "HEAD:$1" 2>/dev/null || echo ""
          }

          # Check Python scripts: claude-code vs codex vs qoder
          SCRIPTS="data_profiler.py ncbi_search.py ncbi_utils.py pubmed_fetch.py pubmed_search.py pmc_fetch.py test_ncbi.py"
          for script in $SCRIPTS; do
            CC_HASH=$(blob_hash "claude-code/scripts/$script")
            CX_HASH=$(blob_hash "codex/clinpub/scripts/scripts/$script")
            QD_HASH=$(blob_hash "qoder/scripts/$script")
            if [ -n "$CC_HASH" ] && [ "$CC_HASH" = "$CX_HASH" ] && [ "$CX_HASH" = "$QD_HASH" ]; then
              echo "  OK: $script (all platforms match)"
            else
              echo "  MISMATCH: $script"
              echo "    claude-code: ${CC_HASH:-MISSING}"
              echo "    codex:       ${CX_HASH:-MISSING}"
              echo "    qoder:       ${QD_HASH:-MISSING}"
              ERRORS=$((ERRORS + 1))
            fi
          done

          # Check project_config.yml template consistency
          # Locate the qoder copy via git tree (avoids non-ASCII paths in this file);
          # core.quotepath=false keeps UTF-8 paths unescaped for rev-parse
          CC_HASH=$(blob_hash "claude-code/pipeline/templates/project_config.yml")
          CX_HASH=$(blob_hash "codex/clinpub/pipeline/templates/project_config.yml")
          QD_CFG_PATH=$(git -c core.quotepath=false ls-tree -r --name-only HEAD qoder | grep 'project_config\.yml' | head -1)
          QD_HASH=$(blob_hash "$QD_CFG_PATH")
          if [ -n "$CC_HASH" ] && [ "$CC_HASH" = "$CX_HASH" ] && [ "$CX_HASH" = "$QD_HASH" ]; then
            echo "  OK: project_config.yml template (all platforms match)"
          else
            echo "  MISMATCH: project_config.yml template"
            echo "    claude-code: ${CC_HASH:-MISSING}"
            echo "    codex:       ${CX_HASH:-MISSING}"
            echo "    qoder:       ${QD_HASH:-MISSING}"
            ERRORS=$((ERRORS + 1))
          fi

          # Check agents consistency (claude-code vs codex only, qoder uses different format)
          AGENTS="analyst-agent.md clinpub-executor.md clinpub-planner.md clinpub-verifier.md modify-agent.md reference-agent.md topic-miner-agent.md writer-agent.md"
          for agent in $AGENTS; do
            CC_HASH=$(blob_hash "claude-code/agents/$agent")
            CX_HASH=$(blob_hash "codex/clinpub/agents/$agent")
            if [ -n "$CC_HASH" ] && [ "$CC_HASH" != "$CX_HASH" ]; then
              echo "  MISMATCH: agents/$agent"
              ERRORS=$((ERRORS + 1))
            fi
          done

          echo ""
          if [ $ERRORS -eq 0 ]; then
            echo "=== All cross-platform files consistent ==="
          else
            echo "=== $ERRORS file(s) inconsistent across platforms ==="
            exit 1
          fi

  release:
    runs-on: ubuntu-latest
    needs: [validate, consistency]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
